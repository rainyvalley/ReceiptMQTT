<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintMQTTify Control Panel</title>
</head>
<body>
    <h1>PrintMQTTify Control Panel</h1>

    <p>MQTT topic: <code>{{ mqtt_topic }}</code></p>
    <p>Configuration is set through container environment variables.
       See the README and <code>docs/hardware-notes.md</code>.</p>

    <h2>Status</h2>
    <button id="status-btn">Check Status</button>
    <pre id="status-output"></pre>

    <h2>Test Print</h2>
    <form id="test-print-form">
        <button type="submit">Send Test Print</button>
    </form>

    <script>
        document.getElementById('status-btn').addEventListener('click', async () => {
            const response = await fetch('/status');
            const data = await response.json();
            document.getElementById('status-output').textContent = JSON.stringify(data, null, 2);
        });

        document.getElementById('test-print-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            let message;
            try {
                const response = await fetch('/test-print', {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'PrintMQTTify' }
                });
                let data = {};
                try { data = await response.json(); } catch (err) { /* not JSON */ }
                message = data.success
                    ? 'Test print sent: ' + (data.output || 'ok')
                    : 'Test print failed: ' + (data.error || ('HTTP ' + response.status));
            } catch (err) {
                message = 'Test print failed: could not reach the panel.';
            }
            alert(message);
        });
    </script>
</body>
</html>
