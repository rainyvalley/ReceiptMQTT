services:
  printmqttify:
    image: ghcr.io/rainyvalley/receiptmqtt:latest
    container_name: printmqttify_container
    ports:
      - "8080:8080"
    # USB device mapping lives in docker-compose.override.yml per host;
    # never pin a /dev/bus/usb/NNN/NNN path here (renumbering broke
    # printing for ten days once).
    environment:
      - PRINTER_DEVICE=/dev/usb/lp1
      - PAPER_DEVICE=/dev/usb/lp1
      # Match the production queue options the old PPD stack ran with
      # (FeedDist=0feed3mm, Cutting=0NoCutting): no extra feed, no cut.
      - FEED_DIST=0
      - CUTTING=0
      - MQTT_BROKER=your-broker-ip
      - MQTT_USERNAME=your-username
      - MQTT_PASSWORD=your-password
      - MQTT_TOPIC=printer/commands
      - ADMIN_USER=admin
      - ADMIN_PASS=your-cups-admin-pass
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stdin_open: true
    tty: true