services:
  printmqttify:
    image: ghcr.io/rainyvalley/receiptmqtt:${IMAGE_TAG:-latest}
    container_name: printmqttify_container
    ports:
      # Host address the panel is published on. Default (all interfaces) is
      # unchanged; set WEB_PUBLISH_BIND=127.0.0.1 in .env for local-only.
      - "${WEB_PUBLISH_BIND:-0.0.0.0}:8080:8080"
    # USB device mapping lives in docker-compose.override.yml per host;
    # never pin a /dev/bus/usb/NNN/NNN path here (renumbering broke
    # printing for ten days once).
    environment:
      # Everything below can be set in .env; the value after :- is used when
      # a setting is missing or empty. See README "Settings".
      - PRINTER_DEVICE=${PRINTER_DEVICE:-${PAPER_DEVICE:-/dev/usb/lp1}}
      - PRINTER_NAME=${PRINTER_NAME:-ReceiptPrinter}
      - PRINTER_URI=${PRINTER_URI:-}
      # Feed and cut after each receipt. These match the old setup (no extra
      # feed, no cut). The program's own defaults, used by plain `docker
      # run`, are FEED_DIST=2 and CUTTING=1.
      - FEED_DIST=${FEED_DIST:-0}
      - CUTTING=${CUTTING:-0}
      - BLANK_SPACE=${BLANK_SPACE:-1}
      - CASH_DRAWER1=${CASH_DRAWER1:-0}
      - CASH_DRAWER2=${CASH_DRAWER2:-0}
      # Paper width in mm: 48 (default) or 80. This one setting sets the page,
      # dot width and row size. 80 mm has not been tested on a real printer.
      - PAPER_WIDTH_MM=${PAPER_WIDTH_MM:-48}
      - RASTER_DPI_X=${RASTER_DPI_X:-203}
      - RASTER_DPI_Y=${RASTER_DPI_Y:-203}
      - RASTER_WIDTH_PX=${RASTER_WIDTH_PX:-}
      - RASTER_HEIGHT_PX=${RASTER_HEIGHT_PX:-480}
      # Print jobs queue behind the one printing; when this many are waiting,
      # newer messages are dropped, logged and published to printer/last_error.
      - PRINT_QUEUE_SIZE=${PRINT_QUEUE_SIZE:-16}
      - MAX_JOBS_PER_MINUTE=${MAX_JOBS_PER_MINUTE:-30}
      - MQTT_BROKER=${MQTT_BROKER:-your-broker-ip}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TLS=${MQTT_TLS:-}
      - MQTT_TLS_CA=${MQTT_TLS_CA:-}
      - MQTT_TLS_INSECURE=${MQTT_TLS_INSECURE:-}
      - MQTT_USERNAME=${MQTT_USERNAME:-your-username}
      - MQTT_PASSWORD=${MQTT_PASSWORD:? .env must set MQTT_PASSWORD}
      - MQTT_TOPIC=${MQTT_TOPIC:-printer/commands}
      - MQTT_AVAILABILITY_TOPIC=${MQTT_AVAILABILITY_TOPIC:-printer/availability}
      - MQTT_PAPER_TOPIC=${MQTT_PAPER_TOPIC:-printer/paper}
      - MQTT_PAPER_LOW_TOPIC=${MQTT_PAPER_LOW_TOPIC:-printer/paper_low}
      - MQTT_LAST_ERROR_TOPIC=${MQTT_LAST_ERROR_TOPIC:-printer/last_error}
      - MQTT_DROPPED_TOTAL_TOPIC=${MQTT_DROPPED_TOTAL_TOPIC:-printer/dropped_total}
      - MQTT_FAILED_TOTAL_TOPIC=${MQTT_FAILED_TOTAL_TOPIC:-printer/failed_total}
      - WEB_BIND=${WEB_BIND:-}
      # HTTPS for the panel: set both (paths inside the container) and mount
      # the files, see README "Turn on HTTPS". Empty means plain HTTP.
      - WEB_TLS_CERT=${WEB_TLS_CERT:-}
      - WEB_TLS_KEY=${WEB_TLS_KEY:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:? .env must set ADMIN_PASS}
      - LOGIN_MAX_FAILURES=${LOGIN_MAX_FAILURES:-5}
      - LOGIN_LOCKOUT_SECONDS=${LOGIN_LOCKOUT_SECONDS:-60}
      - TEST_PRINT_COOLDOWN=${TEST_PRINT_COOLDOWN:-10}
    # Hardening. The entrypoint starts CUPS as root, then runs the app as an
    # unprivileged user, so it needs these few capabilities and nothing else.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Override in .env on small boards: a Pi Zero W has 426 MB in total, so
    # a 512 MB limit lets the container exhaust the host before the cgroup
    # OOM killer acts. MEM_LIMIT=384m is a sensible ceiling there.
    mem_limit: ${MEM_LIMIT:-512m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Graceful shutdown joins the print worker for up to 10s; give it room
    # before docker SIGKILLs (default is 10s).
    stop_grace_period: 15s
    # An unreachable broker at boot is retried with backoff and mid-run
    # outages reconnect on their own; restart covers any other crash.
    restart: unless-stopped
