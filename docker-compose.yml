services:
  printmqttify:
    image: ghcr.io/rainyvalley/receiptmqtt:latest
    container_name: printmqttify_container
    ports:
      - "8080:8080"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - PRINTER_URI=file:/dev/usb/lp1
      - MQTT_BROKER=your-broker-ip
      - MQTT_USERNAME=your-username
      - MQTT_PASSWORD=your-password
      - MQTT_TOPIC=printer/commands
      - ADMIN_USER=admin
      - ADMIN_PASS=your-cups-admin-pass
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stdin_open: true
    tty: true
    devices:
      - "/dev/usb/lp1:/dev/usb/lp1"