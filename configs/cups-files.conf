#
# PrintMQTTify overrides for CUPS in the container.
# Everything not listed here keeps Debian's package defaults.
#

# Administrator group: matches @SYSTEM in cupsd.conf policies; lpadmin is
# the group the entrypoint adds ADMIN_USER to.
SystemGroup root lpadmin

# Debian default log group; keeps log paths where ops expects them.
LogFileGroup adm

AccessLog /var/log/cups/access_log
ErrorLog /var/log/cups/error_log
PageLog /var/log/cups/page_log

# FileDevice Yes: the monitoring queue's file: URI (PRINTER_URI) is only
# legal with this directive.
FileDevice Yes