# CUPS listens on localhost inside the container only. Remote access goes
# through the Flask control panel API, not the CUPS web UI; publish no CUPS
# port by default (see docker-compose.yml).
Listen 127.0.0.1:631
Listen /var/run/cups/cups.sock

# Default log levels
LogLevel warn

# Local (in-container) access only. Nothing is exposed outside the
# container's loopback, so no Allow directives are needed.
<Location />
  Order allow,deny
</Location>

<Location /admin>
  Order allow,deny
</Location>

# Share printers on the local network: no
Browsing Off
BrowseLocalProtocols none

# CUPS admin operations happen over the loopback socket or the control
# panel; leave default auth in place for the tooling that does call them.
DefaultAuthType Basic
WebInterface Yes

MaxJobTime 300
ErrorPolicy abort-job