name: Build and publish Docker image

on:
  push:
    branches: ['main', 'beta']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  lint:
    # PR-triggerable CI: PRs previously got zero checks (no pull_request
    # trigger). Runs on every PR and on pushes; publish jobs below stay
    # gated to non-PR events.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install lint tools
        run: |
          pip install ruff yamllint shellcheck-py
          # Release binaries are pinned by version AND sha256 (from each
          # release's published checksums) so a swapped asset fails the job.
          curl -sfL \
            -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  /usr/local/bin/hadolint" \
            | sha256sum -c -
          chmod +x /usr/local/bin/hadolint
          curl -sfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" \
            | sha256sum -c -
          tar -xzf actionlint.tar.gz -C /usr/local/bin actionlint
          rm actionlint.tar.gz

      - name: Ruff (app/)
        run: ruff check --select=E9,F app/

      - name: Shellcheck
        run: shellcheck entrypoint.sh scripts/*.sh

      - name: hadolint (dockerfile)
        run: hadolint dockerfile

      - name: yamllint (.github/workflows)
        run: yamllint .github/workflows/

      - name: actionlint (.github/workflows)
        run: actionlint

  unit-tests:
    # Pure pytest suite: PBM parsing, ESC/POS encoding, MQTT intake and the
    # control panel, all offline (no sockets, no ghostscript).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # no requirements.txt/pyproject in this repo; the pip cache glob
          # must be pointed at the dev pins or setup-python fails outright
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q --cov=app --cov-report=term

  smoke-test:
    # Integration leg: the full reportlab -> ghostscript pbmraw -> escpos
    # pipeline with the apk-installed runtime stack inside the same
    # alpine:3.22 base the image uses. The test runs via docker run rather
    # than a job container: JS actions (checkout) cannot run on musl.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run pipeline smoke test
        run: |
          # The container runs as root and CUPS is not started here, so only
          # the in-process pipeline (reportlab -> gs -> escpos) is exercised.
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -c '
            apk add --no-cache bash python3 py3-reportlab ghostscript xxd \
            && bash scripts/smoke_test.sh'

  container-check:
    # Gate between the in-container integration test and the push:
    # run the built images and prove bytes actually reach PRINTER_DEVICE.
    # No broker is involved: the container is started with the normal
    # entrypoint disabled and scripts/container_device_check.py drives
    # send_raw_to_printer directly against a mounted device file.
    # This verifies the containerised Python runtime + app code + device
    # writing - deliberately not a full MQTT (broker) round-trip. The
    # arm/v6 leg runs the same check under QEMU so a broken 32-bit build
    # cannot reach the registry (it runs on ARMv7 emulation, so it proves
    # the image works, not that every instruction is ARMv6-safe - the
    # Alpine armhf base is what makes it ARMv6).
    needs: [lint, unit-tests, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Build amd64 image
        run: docker build -f dockerfile -t receiptmqtt:ci .

      - name: Build arm/v6 image
        run: docker buildx build --platform linux/arm/v6 -f dockerfile -t receiptmqtt:ci-armv6 --load .

      - name: Unit tests on the image's Python stack (arm/v6)
        run: |
          # The apk packages (paho, flask, reportlab) are not the pip pins in
          # requirements-dev.txt, and reportlab in particular is much older on
          # Alpine. Run the suite against what the image actually ships, on
          # the slowest architecture, so a version gap fails CI here.
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD:/src" -w /src \
            --entrypoint sh receiptmqtt:ci-armv6 -c '
              apk add --no-cache py3-pytest > /dev/null &&
              python3 -m pytest -q -p no:cacheprovider tests'

      - name: Send raw ESC/POS through the container to a device file
        run: |
          set -euo pipefail
          check() {
            image=$1 platform=$2 dir=$3
            mkdir -p "$dir"
            rm -f "$dir/out.bin"
            docker run --rm --platform "$platform" \
              -e PRINTER_DEVICE=/tmp/out.bin \
              -v "$dir":/tmp \
              -v "$PWD/scripts:/containerscripts:ro" \
              --entrypoint python3 \
              "$image" \
              /containerscripts/container_device_check.py /tmp/out.bin
            # belt and braces: the file on the host side is non-empty
            test -s "$dir/out.bin"
          }
          check receiptmqtt:ci linux/amd64 /tmp/receiptmqtt-device-amd64
          check receiptmqtt:ci-armv6 linux/arm/v6 /tmp/receiptmqtt-device-armv6

  build-and-push:
    needs: [container-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Publish on push events only - pull_request builds never log in or
    # push (metadata-action would otherwise mint branch tags from PRs).
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Log in to the Container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
